services:
  fiware-sth-comet:
    # This fork does not publish Docker images, so the image is built from docker/Dockerfile, which downloads the
    # source code of the STH_SOURCE_BRANCH branch (master by default) of makeOurCity/fiware-sth-comet from GitHub
    build:
      context: ./docker
      args:
        SOURCE_BRANCH: ${STH_SOURCE_BRANCH:-master}
    image: fiware-sth-comet:local
    depends_on:
      - mongo
    ports:
      - "8666:8666"
    environment:
      - STH_HOST=0.0.0.0
      - DB_URI=mongo:27017

  mongo:
    image: mongo:8.0
