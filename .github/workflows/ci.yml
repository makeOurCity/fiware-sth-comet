name: CI
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Run Remark Markdown Linter
        run: |
          npm install
          npm run lint:md
      - name: Run Textlint Markdown Linter
        run: npm run lint:text

  lint-code:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Run EsLint Node.js Linter
        run: |
          npm install
          npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
        - 27017:27017
    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: 'Install Node.js ${{ matrix.node-version }}'
        uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
      - name: 'Unit Tests with Node.js ${{ matrix.node-version }}'
        run: |
          npm install
          npm test

  # The coverage report is kept as an artifact of the workflow run, since this fork does not use Coveralls
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      mongodb:
        image: mongo:8.0
        ports:
        - 27017:27017
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: 'Test Coverage with Node.js 24.x'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: |
          npm install
          npm run test:coverage
      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
